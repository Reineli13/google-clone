<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google-Clon</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos de Google Fonts para la lupa y el teclado -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <!-- Encabezado -->
    <header>
        <nav class="nav-right">
            <a href="#" class="nav-link">Gmail</a>
            <a href="#" class="nav-link">Imágenes</a>
            <a href="#" class="app-icon" title="Aplicaciones de Google">
                <span class="material-symbols-outlined">apps</span>
            </a>
            <a href="#" class="sign-in-btn">Acceder</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main>
        <div class="logo-container">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo">
        </div>

        <!-- Formulario de Búsqueda -->
        <form id="search-form" action="https://www.google.com/search" method="GET">
            <div class="search-bar">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="search-input" name="q" autocomplete="off" autofocus>
                <span class="material-symbols-outlined mic-icon" title="Buscar por voz">mic</span>
                <span class="material-symbols-outlined camera-icon" title="Buscar por imagen">photo_camera</span>
            </div>

            <div class="buttons-container">
                <button type="submit" id="search-btn">Buscar con Google</button>
                <button type="button" id="lucky-btn">Voy a tener suerte</button>
            </div>
        </form>
    </main>

    <!-- Pie de página -->
    <footer>
        <div class="footer-row">
            <span>México</span>
        </div>
        <hr>
        <div class="footer-row links-row">
            <div class="footer-left">
                <a href="#">Sobre Google</a>
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacidad</a>
                <a href="#">Términos</a>
                <a href="#">Configuración</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
